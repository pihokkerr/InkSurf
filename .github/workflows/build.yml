name: NetSurf Kindle build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'build.sh', '.github/workflows/build.yml' ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      KOX_TARGET: kindlehf
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git autoconf automake libtool libtool-bin \
            bison flex texinfo help2man gawk gperf pkg-config \
            libncurses-dev python3 unzip wget file curl rsync

      - name: Restore toolchain (if cached)
        id: tc-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/x-tools
          key: koxtoolchain-${{ env.KOX_TARGET }}-v2

      - name: Build koxtoolchain (if not cached)
        if: steps.tc-restore.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/Niluje/koxtoolchain ~/koxtc
          cd ~/koxtc
          seed() {
            for d in $(find "$HOME/koxtc" -type d -name scripts 2>/dev/null); do
              curl -fsSL -o "$d/config.sub"   'https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.sub'   2>/dev/null || true
              curl -fsSL -o "$d/config.guess" 'https://raw.githubusercontent.com/gcc-mirror/gcc/master/config.guess' 2>/dev/null || true
            done
          }
          ok=0
          for i in 1 2 3 4 5 6; do
            echo "=== attempt #$i ==="
            if ./gen-tc.sh ${{ env.KOX_TARGET }}; then ok=1; break; fi
            echo "failed; replacing config.sub/guess from a mirror, retrying in 20 seconds..."
            seed
            sleep 20
          done
          [ "$ok" = "1" ] || { echo "toolchain build failed"; exit 1; }

      - name: Save toolchain IMMEDIATELY (if just built)
        if: steps.tc-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/x-tools
          key: koxtoolchain-${{ env.KOX_TARGET }}-v2

      - name: Locate compiler (PATH + tuple)
        id: tuple
        run: |
          BINDIR="$(find "$HOME/x-tools" -maxdepth 2 -name bin -type d | head -n1)"
          echo "$BINDIR" >> "$GITHUB_PATH"
          TUPLE="$(basename "$(find "$BINDIR" -name '*-gcc' | head -n1)" | sed 's/-gcc$//')"
          echo "tuple: $TUPLE"
          echo "tuple=$TUPLE" >> "$GITHUB_OUTPUT"

      - name: Build NetSurf + FBInk
        run: |
          chmod +x build.sh
          TARGET_TUPLE="${{ steps.tuple.outputs.tuple }}" JOBS="$(nproc)" ./build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: netsurf-kindle
          path: |
            out/netsurf
            out/fbink
            out/mobitool
            out/libmobi-build.log
            out/res/**
            out/libnsfb-src/**
          if-no-files-found: error
